[package]
name = "llama-helper"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
encoding_rs = "0.8"
llama-cpp-2 = "=0.1.156"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
cuda = ["llama-cpp-2/cuda"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
